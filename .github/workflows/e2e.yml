name: E2E

# Deterministic fixture-site capture/render + golden verification.
# Runner: ubuntu-latest (public repo — hosted minutes free). Switch to
# [self-hosted, linux] on ruby when org limits require it; see docs/ci.md.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  # No paths-ignore on PRs: "e2e goldens" is a required check, so it must
  # report on docs-only PRs too or they can never merge.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Required status check name in the "protect" ruleset — rename both together.
    name: e2e goldens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
        working-directory: examples/verification
      - run: pnpm e2e
        working-directory: examples/verification
      - run: pnpm e2e
        working-directory: examples/derived-steps

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-steps
          path: |
            examples/verification/qa-steps-out/
            examples/derived-steps/qa-steps-out/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            examples/verification/playwright-report/
            examples/verification/test-results/
            examples/derived-steps/test-results/
          retention-days: 7
