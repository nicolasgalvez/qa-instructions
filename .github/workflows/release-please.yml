name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch the required checks on the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

      # release-please pushes its PR with the workflow token, and GitHub starts
      # no pull_request workflows for that token, so the required checks would
      # never run. workflow_dispatch is exempt; the dispatched runs report on
      # the release branch's head commit, which is the PR's.
      - name: Run required checks on the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run e2e.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - uses: procyon-creative/jira-action-man@v2
        if: ${{ steps.release.outputs.release_created }}
        id: jira
        with:
          projects: 'QI'
          from: 'commits'
          post_to_jira: true
          jira_comment_mode: minimal
          jira_base_url: ${{ secrets.JIRA_BASE_URL }}
          jira_email: ${{ secrets.JIRA_EMAIL }}
          jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
