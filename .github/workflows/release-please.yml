name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release-please:
    if: github.repository_owner == 'procyon-creative'
    runs-on: ubuntu-latest
    steps:
      # Manifest mode: release-please-config.json and .release-please-manifest.json
      # version packages/qa-instructions, so its outputs are prefixed with that path.
      - uses: googleapis/release-please-action@v5
        id: release

      # Publish to npm via trusted publishing (OIDC) when a release is created.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs['packages/qa-instructions--release_created'] }}

      - uses: pnpm/action-setup@v6
        if: ${{ steps.release.outputs['packages/qa-instructions--release_created'] }}
        with:
          version: 9

      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs['packages/qa-instructions--release_created'] }}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs['packages/qa-instructions--release_created'] }}

      - run: pnpm --filter @procyon-creative/qa-instructions build
        if: ${{ steps.release.outputs['packages/qa-instructions--release_created'] }}

      - run: pnpm --filter @procyon-creative/qa-instructions publish --access public --no-git-checks
        if: ${{ steps.release.outputs['packages/qa-instructions--release_created'] }}

      - uses: procyon-creative/jira-action-man@v2
        if: ${{ steps.release.outputs['packages/qa-instructions--release_created'] }}
        id: jira
        with:
          projects: 'QI'
          from: 'commits'
          post_to_jira: true
          jira_comment_mode: minimal
          jira_base_url: ${{ secrets.JIRA_BASE_URL }}
          jira_email: ${{ secrets.JIRA_EMAIL }}
          jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
